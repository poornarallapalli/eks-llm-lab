# Istio config for the model-serving path. Apply after Istio is installed and the
# `llm` pods have been restarted with sidecars:  kubectl apply -f k8s/60-istio-mesh.yaml
---
# 1. mTLS: only accept mutual-TLS traffic from mesh workloads in `llm`.
#    Plaintext from a non-mesh pod gets its connection reset.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: llm
spec:
  mtls:
    mode: STRICT
---
# 2. Edge: the ingress gateway listens on port 80 for host llm.example.local
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "llm.example.local"
---
# 3. Routing, used both at the gateway and inside the mesh (gateway: mesh).
#    - Header x-canary: true  -> always the fine-tuned model
#    - Otherwise              -> 90% base model / 10% fine-tuned (canary)
#    Both deployments answer to model name "qwen", so clients don't change.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: llm-api
  namespace: llm
spec:
  hosts:
    - llm.example.local
    - vllm-qwen.llm.svc.cluster.local
  gateways:
    - istio-ingress/llm-gateway
    - mesh
  http:
    - name: canary-by-header
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: vllm-finetuned.llm.svc.cluster.local
            port: { number: 8000 }
      timeout: 300s
    - name: weighted
      route:
        - destination:
            host: vllm-qwen.llm.svc.cluster.local
            port: { number: 8000 }
          weight: 90
        - destination:
            host: vllm-finetuned.llm.svc.cluster.local
            port: { number: 8000 }
          weight: 10
      # LLM responses (especially streamed) can run for minutes; the default 15s
      # route timeout in many proxies would cut them off.
      timeout: 300s
      retries:
        attempts: 2
        # Retry only when the request never reached the model. Retrying a slow
        # generation doubles GPU cost.
        retryOn: connect-failure,refused-stream,unavailable
---
# 4. Per-destination traffic policy: least-request balancing (request lengths vary
#    wildly with LLMs, so round-robin overloads unlucky replicas) and outlier detection
#    (eject a replica that keeps returning 5xx, e.g. GPU XID error, OOM).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: vllm-qwen
  namespace: llm
spec:
  host: vllm-qwen.llm.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      http:
        http2MaxRequests: 256
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: vllm-finetuned
  namespace: llm
spec:
  host: vllm-finetuned.llm.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
# 5. L7 authorization by workload identity (SPIFFE ID from the mTLS cert), not IP.
#    Only the `llm-client` ServiceAccount in `apps` and the ingress gateway may call
#    the OpenAI-style API. Everyone else in the mesh gets HTTP 403 "RBAC: access denied".
#    Applies to every sidecar-injected workload in `llm` (training pods have no sidecar).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-llm-clients
  namespace: llm
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/apps/sa/llm-client
              - cluster.local/ns/istio-ingress/sa/istio-ingressgateway
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/v1/*", "/health"]
---
# 6. Envoy access logs for every sidecar and gateway, so you can see which upstream
#    (vllm-qwen vs vllm-finetuned) served each request.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  accessLogging:
    - providers:
        - name: envoy
