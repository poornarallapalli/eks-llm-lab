# Calico network policy for the `llm` namespace: default deny + explicit allow-list.
# Calico enforces both standard Kubernetes NetworkPolicy and its own (projectcalico.org/v3) CRDs.
# Apply AFTER Calico is installed:  kubectl apply -f k8s/50-calico-policies.yaml
#
# Kubernetes NetworkPolicies are additive allow-lists: once any policy selects a pod for a
# direction (ingress/egress), everything not explicitly allowed in that direction is dropped.
---
# 1. Default deny all ingress and egress for every pod in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. DNS. Without this, nothing resolves and every pod looks "broken".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3. Pods inside `llm` may talk to each other on any port.
#    Needed for DDP: torchrun rendezvous on 29500 + NCCL on dynamic ports between ranks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# 4. Outbound HTTPS to the internet / AWS APIs (Hugging Face, pip, S3), but not to
#    other VPC addresses or link-local addresses on 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/16 # the VPC
              - 169.254.0.0/16 # link-local (IMDS, etc.)
      ports:
        - { protocol: TCP, port: 443 }
---
# 5. EKS Pod Identity agent (runs on every node at a link-local address). Without this
#    the trainer's S3 upload fails with NoCredentialsError: a classic default-deny gotcha.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-identity-agent
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - { protocol: TCP, port: 80 }
---
# 6. Istio sidecars must reach istiod for config (xDS) and certificates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod
  namespace: llm
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - { protocol: TCP, port: 15012 }
---
# 7. Who may call the model servers: the Istio ingress gateway, the `apps` namespace,
#    and Prometheus. 8000 = vLLM, 15020/15090 = Istio sidecar metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-vllm
  namespace: llm
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [vllm-qwen, vllm-finetuned]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [istio-ingress, apps, monitoring]
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 15020 }
        - { protocol: TCP, port: 15090 }
---
# 8. A Calico-only feature: an explicit DENY with an order (priority). Kubernetes
#    NetworkPolicy can only allow. This blocks the EC2 instance metadata service for
#    workloads in `llm` even if someone later adds a broad egress allow, because
#    order 100 is evaluated before Kubernetes policies (which Calico gives order 1000).
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: deny-imds-llm
spec:
  order: 100
  namespaceSelector: kubernetes.io/metadata.name == 'llm'
  types: [Egress]
  egress:
    - action: Deny
      destination:
        nets: [169.254.169.254/32]
