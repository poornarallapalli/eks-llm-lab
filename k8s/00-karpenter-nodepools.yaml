# Apply with:  CLUSTER_NAME=llm-lab envsubst '${CLUSTER_NAME}' < k8s/00-karpenter-nodepools.yaml | kubectl apply -f -
#
# Two pools:
#   default -> cheap CPU nodes for general workloads (Prometheus, test clients, etc.)
#   gpu     -> NVIDIA nodes, tainted so only pods that tolerate the taint (LLM workloads) land there
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: ${CLUSTER_NAME}
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
  limits:
    cpu: 32
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: ${CLUSTER_NAME}
  # Karpenter picks the Bottlerocket *NVIDIA* variant automatically for GPU instance
  # types. That AMI ships the NVIDIA driver, container toolkit AND the k8s device
  # plugin, so `nvidia.com/gpu` shows up as an allocatable resource with no GPU Operator.
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  blockDeviceMappings:
    # Bottlerocket: xvda = OS volume, xvdb = data volume (container images + emptyDirs).
    # LLM images are ~10 GB and model weights land on emptyDir, so give it room.
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        iops: 6000
        throughput: 500
        encrypted: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload: llm
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          # Spot first is cheaper for a lab; Karpenter falls back to on-demand.
          # For training you care about interruptions -> try on-demand only and compare.
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          # g6 = NVIDIA L4 24GB (cheapest modern), g5 = A10G 24GB, g6e = L40S 48GB
          values: ["g6", "g5", "g6e"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge"]
      expireAfter: 168h
  # Cost guardrail: never more than 4 GPUs total from this pool
  limits:
    nvidia.com/gpu: 4
  disruption:
    # Don't let Karpenter "optimize" a GPU node out from under a running job;
    # only remove it once it's empty.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
