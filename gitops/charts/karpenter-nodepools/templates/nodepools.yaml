apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
  limits:
    cpu: {{ .Values.default.cpuLimit }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
{{- if .Values.gpu.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload: llm
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu }
      taints:
        - { key: nvidia.com/gpu, value: "true", effect: NoSchedule }
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.gpu.capacityTypes }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ toJson .Values.gpu.instanceFamilies }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ toJson .Values.gpu.instanceSizes }}
      expireAfter: 168h
  limits:
    nvidia.com/gpu: {{ .Values.gpu.gpuLimit }}
  disruption:
    consolidationPolicy: WhenEmpty   # never consolidate a GPU node out from under a running job
    consolidateAfter: 5m
{{- end }}
{{- if .Values.sandbox.enabled }}
---
# Untrusted sandbox code never shares a kernel with training or platform pods
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox
spec:
  template:
    metadata:
      labels:
        workload: sandbox
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      taints:
        - { key: sandbox, value: "true", effect: NoSchedule }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m] }
        - { key: karpenter.k8s.aws/instance-size, operator: In, values: [xlarge, 2xlarge] }
      expireAfter: 24h   # recycle hosts that ran untrusted code
  limits:
    cpu: {{ .Values.sandbox.cpuLimit }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
{{- end }}
