{{- if .Values.mesh.strictMTLS }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: llm
spec:
  mtls:
    mode: STRICT
{{- end }}
{{- if .Values.mesh.accessLogs }}
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  accessLogging:
    - providers:
        - name: envoy
{{- end }}
