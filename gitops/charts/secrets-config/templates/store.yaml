{{- if not .Values.region }}{{ fail "region is required" }}{{ end }}
# One store for the whole cluster. No `auth` section: ESO uses its own Pod Identity role,
# which can only read secrets under the llm-lab/ prefix (Terraform, eks-spoke module).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .name }}            # the Kubernetes Secret ESO creates and keeps in sync
    creationPolicy: Owner
  data:
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey }}
{{- end }}
