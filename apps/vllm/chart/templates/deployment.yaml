apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0     # keep serving while a new version rolls out
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "vllm.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      {{- if .Values.modelSource.path }}
      {{- if not .Values.modelRegistry }}{{ fail "modelRegistry is empty: it is injected by Argo CD from the cluster annotation model_registry" }}{{ end }}
      initContainers:
        # Copy the approved weights from the registry. Refuse to start on a partial/unapproved upload:
        # the ingest job writes _COMPLETE only after every file and the manifest are uploaded.
        - name: fetch-model
          image: {{ .Values.modelSource.loaderImage }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              SRC="s3://{{ .Values.modelRegistry }}/{{ trimSuffix "/" .Values.modelSource.path }}"
              aws s3 ls "$SRC/_COMPLETE" >/dev/null || { echo "ERROR: $SRC/_COMPLETE missing (not published)"; exit 1; }
              aws s3 sync "$SRC/" /models/weights/ --no-progress --exclude "_COMPLETE"
              echo "model ready: $(du -sh /models/weights | cut -f1) from $SRC"
          env:
            - { name: HOME, value: /tmp }
          {{- if .Values.mesh }}
          securityContext:
            runAsUser: 1337   # Istio proxy UID: init-container traffic bypasses the not-yet-running sidecar
          {{- end }}
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: models, mountPath: /models }
      {{- end }}
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      nodeSelector:
        workload: llm
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - --model={{ if .Values.modelSource.path }}/models/weights{{ else }}{{ .Values.model }}{{ end }}
            - --served-model-name={{ .Values.servedModelName }}
            - --max-model-len={{ .Values.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.gpuMemoryUtilization }}
            - --port=8000
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - { name: HF_HOME, value: /models }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory }}
              nvidia.com/gpu: {{ .Values.resources.gpu }}
            limits:
              memory: {{ .Values.resources.memoryLimit }}
              nvidia.com/gpu: {{ .Values.resources.gpu }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: {{ .Values.modelSource.diskLimit | default "60Gi" }} }   # weights + HF cache; node data volume must be larger
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
