# Code-execution sandboxes (e.g. RL / eval environments where a model runs code it wrote).
# Fast: a SandboxWarmPool keeps N pods booted, so a SandboxClaim adopts one in about a second.
# Isolated: dedicated tainted nodes, non-root, read-only rootfs, no K8s token, managed
# NetworkPolicy (no VPC / metadata access), quota per namespace, TTL on every claim.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted # built-in Pod Security Admission
---
# Separate node pool: untrusted code never shares a kernel with GPU training or platform pods.
# Uses the lab's existing EC2NodeClass "default" (k8s/00-karpenter-nodepools.yaml).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox
spec:
  template:
    metadata:
      labels:
        workload: sandbox
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: sandbox
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]
      expireAfter: 24h # recycle hosts that ran untrusted code
  limits:
    cpu: 32
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandboxes
  namespace: sandboxes
spec:
  hard:
    pods: "100"
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.memory: 96Gi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-runtime
  namespace: sandboxes
spec:
  # The controller creates a NetworkPolicy per sandbox from this (Calico enforces it).
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: sandboxes
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - { protocol: UDP, port: 53 }
          - { protocol: TCP, port: 53 }
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 10.0.0.0/8 # no VPC, no hub, no other clusters
                - 169.254.0.0/16 # no instance metadata / Pod Identity agent
        ports:
          - { protocol: TCP, port: 443 } # e.g. pip install. Tighten to none for fully offline evals
  podTemplate:
    metadata:
      labels:
        app: python-sandbox
    spec:
      automountServiceAccountToken: false # untrusted code gets no Kubernetes credentials
      enableServiceLinks: false
      nodeSelector:
        workload: sandbox
      tolerations:
        - key: sandbox
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8888", "--directory", "/workspace"]
          ports:
            - containerPort: 8888
          # Fast probe matters: a 10s periodSeconds alone adds up to 10s to every cold start
          readinessProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-runtime
  namespace: sandboxes
spec:
  replicas: 5 # size to expected burst concurrency; claims beyond this fall back to cold starts
  sandboxTemplateRef:
    name: python-runtime
---
# Scrape the Agent Sandbox controller's metrics (claim latency, pool size) into Prometheus,
# which forwards them to the hub with cluster=<name>.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: agent-sandbox-controller
  endpoints:
    - port: metrics
      interval: 15s
