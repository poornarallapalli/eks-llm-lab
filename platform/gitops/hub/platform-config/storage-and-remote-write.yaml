# Default gp3 StorageClass for PVCs (Prometheus TSDB, Grafana)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer # create the EBS volume in the AZ the pod is scheduled to
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
---
# Internal NLB in front of the central Prometheus, reachable from spoke VPCs over peering.
# AWS Load Balancer Controller builds the NLB; ExternalDNS publishes
# prometheus.platform.internal -> NLB in the shared private hosted zone.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-remote-write
  namespace: monitoring
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    external-dns.alpha.kubernetes.io/hostname: prometheus.platform.internal
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  # Only private ranges (hub 10.100/16 + spokes 10.x/16). Production: also authN (mTLS,
  # basic auth, or SigV4 with Amazon Managed Prometheus) and per-tenant limits (Mimir).
  loadBalancerSourceRanges:
    - 10.0.0.0/8
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kps-kube-prometheus-stack-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
