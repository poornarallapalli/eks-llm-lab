# ApplicationSets targeting every SPOKE (cluster secret label role=spoke).
# Add a new cluster to var.spoke_clusters in hub-terraform -> it gets all of this automatically.
---
# Local Prometheus (short retention) that forwards everything to the hub via remote_write,
# stamping each series with cluster=<name>. Keeps scraping/alerting working if the hub is down.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-monitoring
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: spoke
  template:
    metadata:
      name: "monitoring-{{.name}}"
    spec:
      project: default
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 93.4.1
        helm:
          releaseName: kps # same name as the lab's manual install, so PodMonitors keep matching
          valuesObject:
            grafana:
              enabled: false # dashboards live on the hub
            alertmanager:
              enabled: false # lab: alert centrally. Production: often keep local alerting too
            prometheus:
              prometheusSpec:
                retention: 6h
                externalLabels:
                  cluster: "{{.name}}"
                podMonitorSelectorNilUsesHelmValues: false
                serviceMonitorSelectorNilUsesHelmValues: false
                remoteWrite:
                  - url: '{{index .metadata.annotations "remote_write_url"}}'
                    queueConfig:
                      capacity: 10000
                      maxShards: 10
                      maxSamplesPerSend: 2000
      destination:
        server: "{{.server}}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# Kueue: quota, fair sharing, gang admission and preemption for training jobs
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-kueue
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: spoke
  template:
    metadata:
      name: "kueue-{{.name}}"
    spec:
      project: default
      source:
        repoURL: registry.k8s.io/kueue/charts # OCI repo, registered in Argo CD by Terraform
        chart: kueue
        targetRevision: 0.20.6
        helm:
          releaseName: kueue
      destination:
        server: "{{.server}}"
        namespace: kueue-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# Team queues: ResourceFlavors, ClusterQueues in a cohort, LocalQueues, priorities
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-kueue-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: spoke
  template:
    metadata:
      name: "kueue-config-{{.name}}"
    spec:
      project: default
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: '{{index .metadata.annotations "gitops_path"}}/spokes/kueue-config'
      destination:
        server: "{{.server}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - SkipDryRunOnMissingResource=true # Kueue CRDs may not exist yet on first sync
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# Agent Sandbox controller (core + extensions: templates, warm pools, claims)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-agent-sandbox
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: spoke
  template:
    metadata:
      name: "agent-sandbox-{{.name}}"
    spec:
      project: default
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: '{{index .metadata.annotations "gitops_path"}}/spokes/agent-sandbox'
      destination:
        server: "{{.server}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# The sandbox platform: dedicated Karpenter NodePool, template, warm pool, quota, monitors
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-sandbox-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: spoke
  template:
    metadata:
      name: "sandbox-platform-{{.name}}"
    spec:
      project: default
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: '{{index .metadata.annotations "gitops_path"}}/spokes/sandbox-platform'
      destination:
        server: "{{.server}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - SkipDryRunOnMissingResource=true # waits for the Agent Sandbox / Prometheus CRDs
        retry:
          limit: 20
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
