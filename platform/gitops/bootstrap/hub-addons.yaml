# ApplicationSets targeting the HUB (cluster secret label role=hub).
# Helm values are templated from the cluster secret's annotations, which Terraform wrote
# (the "GitOps Bridge"): Terraform knows AWS facts, Argo CD knows how to install software.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: hub
  template:
    metadata:
      name: "aws-lbc-{{.name}}"
    spec:
      project: default
      source:
        repoURL: https://aws.github.io/eks-charts
        chart: aws-load-balancer-controller
        targetRevision: 3.6.3
        helm:
          releaseName: aws-load-balancer-controller
          valuesObject:
            clusterName: '{{index .metadata.annotations "cluster_name"}}'
            region: '{{index .metadata.annotations "aws_region"}}'
            vpcId: '{{index .metadata.annotations "aws_vpc_id"}}'
            replicaCount: 2
            serviceAccount:
              create: true
              name: aws-load-balancer-controller # Pod Identity association created by Terraform
      destination:
        server: "{{.server}}"
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: hub
  template:
    metadata:
      name: "external-dns-{{.name}}"
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.24.0
        helm:
          releaseName: external-dns
          valuesObject:
            provider:
              name: aws
            sources: [service]
            policy: sync
            txtOwnerId: '{{index .metadata.annotations "cluster_name"}}'
            domainFilters:
              - '{{index .metadata.annotations "private_zone"}}'
            extraArgs:
              - --aws-zone-type=private
            serviceAccount:
              create: true
              name: external-dns # Pod Identity association created by Terraform
      destination:
        server: "{{.server}}"
        namespace: external-dns
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# gp3 StorageClass + the remote-write NLB Service (plain manifests from Git)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-platform-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: hub
  template:
    metadata:
      name: "platform-config-{{.name}}"
    spec:
      project: default
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: '{{index .metadata.annotations "gitops_path"}}/hub/platform-config'
      destination:
        server: "{{.server}}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
# Central Prometheus (remote-write receiver, 15 days on EBS) + Grafana (multi-cluster dashboards)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-monitoring
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: hub
  template:
    metadata:
      name: "monitoring-{{.name}}"
    spec:
      project: default
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 93.4.1
        helm:
          releaseName: kps
          valuesObject:
            prometheus:
              prometheusSpec:
                enableRemoteWriteReceiver: true # accept POST /api/v1/write from spokes
                retention: 15d
                retentionSize: 40GB
                externalLabels:
                  cluster: '{{index .metadata.annotations "cluster_name"}}'
                podMonitorSelectorNilUsesHelmValues: false
                serviceMonitorSelectorNilUsesHelmValues: false
                resources:
                  requests: { cpu: 500m, memory: 2Gi }
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      storageClassName: gp3
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: 50Gi
            grafana:
              adminPassword: admin123 # lab only. Production: SSO + secret from a secret store
              persistence:
                enabled: true
                storageClassName: gp3
                size: 5Gi
              sidecar:
                dashboards:
                  multicluster:
                    global:
                      enabled: true # adds a "cluster" dropdown to the bundled dashboards
      destination:
        server: "{{.server}}"
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # the Prometheus Operator CRDs are too big for client-side apply
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
